  <title>No encontramos esa página — Blink</title>
  <meta name="theme-color" content="#007AFF">
  <script>
    /* Las rutas del POS conservan su enlace corto: /app/* y /escaner viven ahora en pos.blink.com.ve. */
    (function () {
      var ruta = location.pathname;
      if (/^\/(app|escaner)(\/|$)/.test(ruta)) {
        location.replace("https://pos.blink.com.ve" + ruta + location.search + location.hash);
      }
    })();
  </script>

      color: var(--blanco); text-align: center; padding: 32px;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: -0.03em; margin: 0 0 12px; }
    p { margin: 0 0 28px; opacity: .85; }
    a {
      display: inline-block; padding: 13px 26px; border-radius: 999px;
      background: var(--blanco); color: #0062cc; font-weight: 600; text-decoration: none;
    }
